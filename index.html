
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/images/logo-FC.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />

    <title>Formación Cristiana</title>

    <script>
  window.addEventListener("error", function (event) {
    document.body.innerHTML =
      "<pre style='white-space:pre-wrap;padding:20px;font-size:16px'>" +
      "ERROR JS:\n" +
      (event.message || "Error desconocido") +
      "\n\nArchivo:\n" +
      (event.filename || "") +
      "\n\nLínea: " +
      (event.lineno || "") +
      "</pre>";
  });

  window.addEventListener("unhandledrejection", function (event) {
    document.body.innerHTML =
      "<pre style='white-space:pre-wrap;padding:20px;font-size:16px'>" +
      "PROMISE ERROR:\n" +
      (event.reason?.message || event.reason || "Error desconocido") +
      "</pre>";
  });
</script>

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
